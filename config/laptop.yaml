
# =============================================================================
# Vision BOB - Assistive Vision System Configuration
# =============================================================================
# Copy this file to config/config.local.yaml for local overrides.
# Local overrides are never committed.

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
camera:
  width: 640
  height: 480
  fps: 15
  # "picamera2" | "opencv" | "mock"
  backend: "opencv"
  device_index: 0            # used only by opencv backend

# ---------------------------------------------------------------------------
# Sensor (HC-SR04 Ultrasonic)
# ---------------------------------------------------------------------------
sensor:
  # "gpio" | "mock"
  backend: "mock"
  trigger_pin: 23            # BCM numbering
  echo_pin: 24               # BCM numbering
  max_distance_m: 4.0
  timeout_s: 0.04            # 40 ms → ~6.8 m round-trip max
  sample_count: 3            # median of N readings for stability
  ping_interval_s: 0.06      # min gap between pings (HC-SR04 needs >= 60 ms)
  stale_after_s: 0.6         # reading older than this is reported invalid

# ---------------------------------------------------------------------------
# Hardware (GPIO)
# ---------------------------------------------------------------------------
hardware:
  vibration_pin: 18          # PWM-capable pin (BCM)
  # "gpio" | "mock"
  gpio_backend: "mock"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  object_detection:
    path: "models/object_detection/yolov8n.onnx"
    # "onnx" | "tflite" | "mock"
    backend: "onnx"
    confidence_threshold: 0.45
    nms_threshold: 0.45
    # [width, height]. For fixed-size ONNX models the model's own size wins
    # (a warning is logged if this differs).
    input_size: [640, 640]
    class_names_path: "models/object_detection/coco_classes.txt"

  face_detection:
    path: "models/face_detection/face_detection_yunet.onnx"
    # "yunet_opencv" | "mock"
    backend: "yunet_opencv"
    confidence_threshold: 0.60
    nms_threshold: 0.30

  face_recognition:
    path: "models/face_recognition/mobilefacenet.onnx"
    # "onnx" | "mock"
    backend: "onnx"
    similarity_threshold: 0.55   # cosine similarity; higher = stricter
    embeddings_path: "data/face_embeddings/embeddings.pkl"
    input_size: [112, 112]

  depth:
    enabled: false             # optional monocular depth; set true only if Pi can sustain it
    path: "models/depth/midas_small.onnx"
    # "onnx" | "mock"
    backend: "onnx"
    input_size: [256, 256]

# ---------------------------------------------------------------------------
# Distance estimation
# ---------------------------------------------------------------------------
distance:
  # Thresholds (metres)
  very_near_m: 0.80
  near_m:      1.50
  medium_m:    3.00
  # above medium_m is classified as "far"

  # Weight of ultrasonic vs. bbox-based estimate (0.0 = bbox only, 1.0 = ultrasonic only)
  ultrasonic_weight: 0.75

# ---------------------------------------------------------------------------
# Risk engine
# ---------------------------------------------------------------------------
risk:
  # Per-class priority multipliers (default 1.0 for unlisted)
  class_priority:
    person:      1.4
    car:         1.6
    truck:       1.6
    motorcycle:  1.5
    bicycle:     1.3
    dog:         1.2
    cat:         1.0
    chair:       1.1
    dining table: 1.1

  # Fraction of frame width within which a centred object scores higher
  centre_zone_fraction: 0.50

  # Minimum object confidence to enter risk pipeline
  min_confidence: 0.40

# ---------------------------------------------------------------------------
# Object tracking (lightweight IoU-based)
# ---------------------------------------------------------------------------
tracking:
  max_age_frames: 8          # drop track after N frames without match
  min_iou: 0.30
  history_len: 6             # frames kept per track for velocity estimation
  approach_threshold: 0.04   # relative bbox-area growth per frame → approaching

# ---------------------------------------------------------------------------
# Alerts6:45 PM 10/8/2026
# ---------------------------------------------------------------------------
alerts:
  cooldown_ms: 1200          # minimum ms between same-priority alerts
  speech_backend: "mock"   # "espeak" | "gtts" | "mock"
  haptic_backend: "mock"     # "gpio" | "mock"

  haptic_patterns:
    low:      {pulses: 1, on_ms: 150, off_ms: 0}
    medium:   {pulses: 2, on_ms: 200, off_ms: 100}
    high:     {pulses: 3, on_ms: 250, off_ms: 80}
    critical: {pulses: 5, on_ms: 300, off_ms: 60}

  speech_messages:
    approaching: "{object} approaching"
    obstacle:    "Obstacle ahead, {object}"
    crowd:       "Crowd ahead"
    known_person:   "Hello {name}"
    unknown_person: "Unknown person nearby"

# ---------------------------------------------------------------------------
# Performance / Debug
# ---------------------------------------------------------------------------
performance:
  log_fps: true
  log_latency: true
  log_cpu: false
  log_memory: false
  debug_overlay: false       # draw bounding boxes on frame (dev only)
  stats_interval_s: 10       # how often to print aggregated stats

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"              # DEBUG | INFO | WARNING | ERROR
  file: "logs/vision_bob.log"
  max_bytes: 5242880         # 5 MB
  backup_count: 3
